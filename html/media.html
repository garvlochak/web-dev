<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media</title>
  </head>
  <body>
    <h1>This is media learning</h1>
    <img
      src="./images/images.png"
      title="Nature image"
      width="200px"
      alt="Nature image"
    />
    <p>Butterfly</p>

    <figure>
      <img
        src="images/images.png"
        alt="Elephant at sunset"
        width="200px"
      />
      <figcaption>An elephant at sunset</figcaption>
    </figure>
    <video src="./images/video.mp4" width="400px" controls disablepictureinpicture controlslist=" noremoteplayback noplaybackrate  ></video>
    

  </body>
</html>
