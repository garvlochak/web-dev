<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding:0 ;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .card {
            background-color: #9e4f4f;
            border-radius: 8px;
            padding: 30px;
            width: 300px;
            
        }
        h2 {
            color: #50c748;
            text-align: center;
            margin-bottom: 20px;

        }
        form {
            display: flex;
            flex-direction: column;
            gap:20px

        }
        input {
            margin-bottom:15px ;
            padding: 15px;
            border: 5px;
            background-color: #9bab95ff;
            border: 1px solid black;

        }
        button {
            background-color: #7e0505;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
        }
        button:hover{
            background-color: rgb(188, 142, 85);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form >
            <input type="email" name="" id="" placeholder="Email">
            <input type="password" name="" id="" placeholder="Password">
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
