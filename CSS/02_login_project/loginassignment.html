<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        body {
            background-color: gray;
            margin: 0px;
            padding: 0px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: green;
            border-radius: 12px;
            padding:20px;
            width: 250px;
            
        }
        h2 {
            color: rgb(42, 231, 42);
            text-align: center;
            margin-bottom: 25px;

        }

    form {
        display: flex;
        flex-direction: column;
        gap: 10px;

    }
        input {
            background-color: rgb(39, 200, 39);
            padding: 8px;
            border-radius: 12px;
            border-color: black;
            margin-bottom: 5px;

        }
    button {
        background-color: rgb(9, 144, 9);
        border-radius: 14px;
        padding: 11px;
        
        
    }
    button:hover {
        background-color: rgb(107, 165, 19);
    }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" name="" id="" placeholder="Email">
            <input type="password" name="" id="" placeholder="Password">
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
